name: safesense
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  go_router: ^18.1.0
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/safesense_logo.png
