
name: safesense
description: "SafeSense community crime reporting and safety application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  flutter_dotenv: ^6.0.1
  go_router: ^18.0.2
  flutter_map: 8.3.2
  latlong2: 0.10.1
  geolocator: 14.0.3
  dio: 5.9.0
  intl: 0.20.3
  fl_chart: 1.1.1
  sensors_plus: ^7.1.1
  url_launcher: ^6.3.3
  geocoding: ^5.0.0
  file_picker: ^13.1.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/safesense_logo.png
    - assets/images/logo_mark.png
    - assets/sounds/alert.wav
